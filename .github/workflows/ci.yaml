  #         rm -rf extension/app && mkdir extension/app
  #         cp -r build/web/. extension/app/
  #         rm -f extension/app/flutter_service_worker.js
  #     - run: cd extension && zip -r ../extension.zip .
  #     - run: >
  #         npx -y chrome-webstore-upload-cli@4 upload
  #         --source extension.zip
  #         --extension-id ${{ secrets.CHROME_EXTENSION_ID }}
  #         --client-id ${{ secrets.CHROME_CLIENT_ID }}
  #         --client-secret ${{ secrets.CHROME_CLIENT_SECRET }}
  #         --refresh-token ${{ secrets.CHROME_REFRESH_TOKEN }}
  #     # NOTE: no commit-back here — on tag runs there is no branch to
  #     # push to, and the tag itself is the version record.
  #

  build-snap:
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: snapcore/action-build@v1
        id: build
      - uses: actions/upload-artifact@v7
        with:
          name: sudoku-puzzle-game-snap
          path: ${{ steps.build.outputs.snap }}

  publish-firefox:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/ext-v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Version comes from the tag (ext-1.2.0 -> 1.2.0), raised past
      # every version already on AMO so resubmissions never collide.
      - name: Set extension version from tag
        run: |
          python3 - <<'EOF'
          import json
          import os
          import re
          import urllib.request

          def parse(v):
              try:
                  return tuple(int(x) for x in str(v).split('.'))
              except ValueError:
                  return (0, 0, 0)

          tag = os.environ['GITHUB_REF_NAME']
          match = re.fullmatch(r'ext-v(\d+\.\d+\.\d+)', tag)
          if not match:
              raise SystemExit(f'Refusing to publish from tag {tag!r}')
          wanted = parse(match.group(1))
          try:
              with urllib.request.urlopen(
                  'https://addons.mozilla.org/api/v5/addons/'
                  'addon/sudoku@ashutoshsajan/versions/',
                  timeout=30,
              ) as r:
                  data = json.load(r)
              amo = max(
                  (parse(v['version']) for v in data.get('results', [])),
                  default=(0, 0, 0),
              )
          except Exception as e:
              print(f'AMO check failed ({e}), trusting tag version')
              amo = (0, 0, 0)
          version = max(wanted, (amo[0], amo[1], amo[2] + 1))
          path = 'extension/manifest.json'
          with open(path) as f:
              manifest = json.load(f)
          manifest['version'] = f'{version[0]}.{version[1]}.{version[2]}'
          with open(path, 'w') as f:
              json.dump(manifest, f, indent=2)
              f.write('\n')
          print(f"Publishing extension version {manifest['version']}")
          EOF
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --pwa-strategy=none --no-web-resources-cdn
      - run: |
          rm -rf extension/app && mkdir extension/app
          cp -r build/web/. extension/app/
          rm -f extension/app/flutter_service_worker.js
      # Listed submissions need human review (days), so submit without
      # waiting. AMO signs automatically once approved; there is no .xpi
      # artifact for listed versions before that.
      - run: >
          npx -y web-ext@10 sign --source-dir=extension
          --api-key ${{ secrets.AMO_API_KEY }}
          --api-secret ${{ secrets.AMO_API_SECRET }}
          --channel listed
          --amo-metadata extension/amo-metadata.json
          --approval-timeout 0
