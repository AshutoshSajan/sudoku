  publish-firefox:
    needs: verify
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bump extension version
        run: |
          python3 - <<'EOF'
          import json
          path = 'extension/manifest.json'
          with open(path) as f:
              manifest = json.load(f)
          major, minor, patch = (
              int(x) for x in manifest['version'].split('.')
          )
          manifest['version'] = f'{major}.{minor}.{patch + 1}'
          with open(path, 'w') as f:
              json.dump(manifest, f, indent=2)
              f.write('\n')
          print(f"Publishing extension version {manifest['version']}")
          EOF
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --pwa-strategy=none --no-web-resources-cdn
      - run: |
          rm -rf extension/app && mkdir extension/app
          cp -r build/web/. extension/app/
          rm -f extension/app/flutter_service_worker.js
      # Listed submissions need human review (days), so submit without
      # waiting. AMO signs automatically once approved; there is no .xpi
      # artifact for listed versions before that.
      - run: >
          npx -y web-ext@10 sign --source-dir=extension
          --api-key ${{ secrets.AMO_API_KEY }}
          --api-secret ${{ secrets.AMO_API_SECRET }}
          --channel listed
          --amo-metadata extension/amo-metadata.json
          --approval-timeout 0
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add extension/manifest.json
          git diff --cached --quiet || git commit -m "chore(extension): bump store version [skip ci]"
          git push
