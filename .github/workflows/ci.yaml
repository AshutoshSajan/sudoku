name: CI

on:
  push:
    branches: [main]
    # Extension release: push a tag like ext-1.2.0 and only the
    # publish jobs run for it. Plain merges just verify.
    tags: ['ext-v*']
  pull_request:
    branches: [main]
  # Manual snap build: Actions tab → CI → Run workflow (or
  # `gh workflow run CI --ref main`). Uploads the .snap artifact.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  changelog:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: -o CHANGELOG.md
      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "docs: update changelog [skip ci]"
          git push

  # ── Extension publishing (disabled until store secrets are configured) ──
  # Setup: add the secrets below in repo Settings → Secrets → Actions,
  # then uncomment the job you want. All pinned to current majors
  # (checkout v7, flutter-action v2, upload-artifact v7).
  #
  # publish-chrome:
  #   needs: verify
  #   if: startsWith(github.ref, 'refs/tags/ext-v')
  #   permissions:
  #     contents: write
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - name: Set extension version from tag
  #       run: |
  #         python3 - <<'EOF'
  #         import json, os, re
  #         tag = os.environ['GITHUB_REF_NAME']
  #         version = re.fullmatch(r'ext-v(\d+\.\d+\.\d+)', tag).group(1)
  #         path = 'extension/manifest.json'
  #         with open(path) as f:
  #             manifest = json.load(f)
  #         manifest['version'] = version
  #         with open(path, 'w') as f:
  #             json.dump(manifest, f, indent=2)
  #             f.write('\n')
  #         print(f"Publishing extension version {version}")
  #         EOF
  #     - uses: subosito/flutter-action@v2
  #       with:
  #         channel: stable
  #         cache: true
  #     - run: flutter pub get
  #     - run: flutter build web --release --pwa-strategy=none
