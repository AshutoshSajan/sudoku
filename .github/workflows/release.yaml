name: Release

# One-tag binary releases: push `vX.Y.Z` on main (or dispatch manually
# for a dry run) and every distributable is built and attached to the
# GitHub Release. Extension tags (`ext-v*`) are NOT matched here.
# A weekly scheduled dry-run (full matrix, never publishes: the publish
# step is tag-gated) catches toolchain bitrot between releases. Daily
# would cost ~7x the minutes for no extra signal; bump the cron if needed.
on:
  push:
    tags: ['v*']
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version X.Y.Z override (defaults to tag, else pubspec)'
        required: false
        default: ''
      platforms:
        description: 'Comma-separated subset to build: android,linux,appimage,windows,web,snap (default: all)'
        required: false
        default: 'all'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  resolve-version:
    needs: verify
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      build-number: ${{ steps.ver.outputs.build-number }}
    steps:
      - uses: actions/checkout@v7
      - id: ver
        run: |
          python3 - <<'EOF'
          import os
          import re

          ref = os.environ.get('GITHUB_REF', '')
          ref_name = os.environ.get('GITHUB_REF_NAME', '')
          override = os.environ.get(
              'INPUT_VERSION', os.environ.get('VERSION_INPUT', '')).strip()

          version = ''
          if ref.startswith('refs/tags/'):
              m = re.fullmatch(r'v(\d+\.\d+\.\d+)', ref_name)
              # ext-v* tags must never drive an app release.
              if not m:
                  raise SystemExit(
                      f"Tag {ref_name!r} is not a vX.Y.Z app release tag")
              version = m.group(1)
          if not version:
              version = override
          if not version:
              with open('pubspec.yaml') as f:
                  pub = f.read()
              version = re.search(
                  r'^version:\s*(\d+\.\d+\.\d+)',
                  pub, re.M).group(1)
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit(f'Invalid version {version!r}')

          out = os.environ['GITHUB_OUTPUT']
          with open(out, 'a') as f:
              f.write(f"version={version}\n")
              f.write(f"build-number={os.environ['GITHUB_RUN_NUMBER']}\n")
          print(f'Releasing version {version}')
          EOF

  build-android:
    needs: resolve-version
    # Tag pushes always build everything; manual dispatches may select a
    # subset so a single-artifact fix costs one job, not nine.
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.platforms == 'all' ||
      contains(inputs.platforms, 'android')
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      BUILD_NUMBER: ${{ needs.resolve-version.outputs.build-number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Restore upload keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: >
          flutter build apk --release --split-per-abi
          --build-name="$VERSION" --build-number="$BUILD_NUMBER"
      - run: >
          flutter build apk --release
          --build-name="$VERSION" --build-number="$BUILD_NUMBER"
      - run: >
          flutter build appbundle --release
          --build-name="$VERSION" --build-number="$BUILD_NUMBER"
      - run: |
          mkdir -p dist
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            "dist/sudoku-$VERSION-android-armv7.apk"
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "dist/sudoku-$VERSION-android-arm64.apk"
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk \
            "dist/sudoku-$VERSION-android-x86_64.apk"
          mv build/app/outputs/flutter-apk/app-release.apk \
            "dist/sudoku-$VERSION-android-universal.apk"
          mv build/app/outputs/bundle/release/app-release.aab \
            "dist/sudoku-$VERSION.aab"
          ls dist/
      - uses: actions/upload-artifact@v7
        with:
          name: android-dist
          path: dist/

  build-linux:
    needs: resolve-version
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.platforms == 'all' ||
      contains(inputs.platforms, 'linux')
    # Oldest supported runner: glibc 2.35 baseline runs on Ubuntu 22.04
    # through the latest releases (forward-compatible), plus Debian 12+,
    # Fedora 36+ and RHEL 9+. A 24.04 build would not install on 22.04.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      BUILD_NUMBER: ${{ needs.resolve-version.outputs.build-number }}
    steps:
      - uses: actions/checkout@v7
      - run: >
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config
          libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >
          flutter build linux --release
          --build-name="$VERSION" --build-number="$BUILD_NUMBER"
      - name: Install nfpm (latest release)
        run: |
          tag=$(gh api repos/goreleaser/nfpm/releases/latest --jq .tag_name)
          curl -sSL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/$tag/nfpm_${tag#v}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          sudo install -m 0755 /tmp/nfpm /usr/local/bin/nfpm
          nfpm --version
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          mkdir -p dist
          sed "s/@VERSION@/$VERSION/g" packaging/nfpm.yaml.in > packaging/nfpm.yaml
          nfpm package --config packaging/nfpm.yaml --packager deb --target dist/
          nfpm package --config packaging/nfpm.yaml --packager rpm --target dist/
          # LICENSE travels inside the tarball (deb/rpm get it via nfpm contents).
          tar -czf "dist/sudoku-$VERSION-linux-x64.tar.gz" \
            -C build/linux/x64/release bundle -C "$GITHUB_WORKSPACE" LICENSE
          ls dist/
      - uses: actions/upload-artifact@v7
        with:
          name: linux-dist
          path: dist/

  build-appimage:
    needs: resolve-version
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.platforms == 'all' ||
      contains(inputs.platforms, 'appimage')
    # glibc floor: 24.04-built AppImages won't run on older distros.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      BUILD_NUMBER: ${{ needs.resolve-version.outputs.build-number }}
    steps:
      - uses: actions/checkout@v7
      - run: >
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config
          libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >
          flutter build linux --release
          --build-name="$VERSION" --build-number="$BUILD_NUMBER"
      - name: Fetch linuxdeploy + appimagetool
        run: |
          mkdir -p tools dist
          curl -sSL -o tools/linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSL -o tools/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x tools/linuxdeploy tools/appimagetool
      - run: |
          export PATH="$PWD/tools:$PATH"
          export APPIMAGE_EXTRACT_AND_RUN=1
          # Icon filename must match the desktop file's Icon= entry.
          cp web/icons/Icon-512.png packaging/sudoku.png
          # Stage 1: deploy the executable and its linked libraries.
          ./tools/linuxdeploy --appdir AppDir \
            -e build/linux/x64/release/bundle/sudoku \
            -d packaging/sudoku.desktop \
            -i packaging/sudoku.png
          # Stage 2: the Flutter engine loads lib/libapp.so and data/
          # relative to the executable; linuxdeploy does not copy them.
          cp -r build/linux/x64/release/bundle/lib \
                build/linux/x64/release/bundle/data AppDir/usr/bin/
          # GPL: license text travels inside the image.
          cp LICENSE AppDir/
          test -f AppDir/usr/bin/lib/libapp.so
          test -d AppDir/usr/bin/data/flutter_assets
          # Stage 3: package the staged AppDir.
          ARCH=x86_64 ./tools/appimagetool AppDir "dist/Sudoku-$VERSION-x86_64.AppImage"
          "./dist/Sudoku-$VERSION-x86_64.AppImage" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          ls dist/
      - uses: actions/upload-artifact@v7
        with:
          name: appimage-dist
          path: dist/

  build-windows:
    needs: resolve-version
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.platforms == 'all' ||
      contains(inputs.platforms, 'windows')
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      BUILD_NUMBER: ${{ needs.resolve-version.outputs.build-number }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >
          flutter build windows --release
          --build-name=$env:VERSION --build-number=$env:BUILD_NUMBER
      - run: mkdir dist
      - name: Portable zip
        run: >
          Compress-Archive
          -Path build\windows\x64\runner\Release\*,LICENSE
          -DestinationPath dist\sudoku-$env:VERSION-windows-x64-portable.zip
      # No EV cert for v1: SmartScreen will warn. Portable zip is the
      # no-friction alternative; signing is a documented follow-up.
      - name: Inno Setup installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DAppVersion=$env:VERSION `
            /Odist /Fsudoku-$env:VERSION-windows-x64-setup `
            packaging\inno\sudoku.iss
          Get-ChildItem dist\
      - uses: actions/upload-artifact@v7
        with:
          name: windows-dist
          path: dist/

  build-web:
    needs: resolve-version
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.platforms == 'all' ||
      contains(inputs.platforms, 'web')
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - run: |
          mkdir -p dist
          cp LICENSE build/
          cd build && zip -qr "../dist/sudoku-$VERSION-web.zip" web LICENSE
          ls ../dist/
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist/
      # GitHub Pages mirror (CONVENTIONS.md §6): the project site serves
      # under /sudoku/, so rebuild with the matching --base-href — the
      # root-based build above would 404 every asset there. Kept after the
      # zip step so both variants come from the same commit; the second
      # build reuses the compiled kernel cache, so it is the cheap leg.
      - run: flutter build web --release --base-href="/sudoku/"
      - run: |
          mkdir -p site && cp -r build/web/. site/
      - uses: actions/upload-artifact@v7
        with:
          name: gh-pages-site
          path: site/

  deploy-gh-pages:
    # The second hosted mirror of the release: the web app on GitHub
    # Pages. Same release moment as deploy-web — ONLY a pushed `v*` tag
    # deploys; dispatches build but stop here. Requires the repo's
    # Settings → Pages → Build source = "GitHub Actions" (flip once;
    # until then this job fails loudly with that hint).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [resolve-version, publish]
    runs-on: ubuntu-24.04
    # deploy-pages publishes through the pages environment and the
    # github-actions OIDC token — both are required by the action itself.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Pages deploys are serialized repo-wide, not per-run like the rest of
    # the release: two tag pushes must publish in tag order, not race.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: gh-pages-site
          path: site/
      # Loud pre-check: fails with Pages' own error when the source is not
      # "GitHub Actions" yet, instead of a failure half a pipeline later.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-web:
    # The release moment, continued: once the GitHub Release is out, the
    # hosted web site follows it via Netlify's build hook.
    #
    # A build hook instead of Netlify's Git integration, because a tag is
    # not a branch: Netlify builds the branch it is pointed at (main), and
    # it offers no "deploy when a tag lands" trigger. Tags are cut on the
    # newest `[skip ci]`-free merge commit (CONVENTIONS.md §6), so a hook —
    # which rebuilds main's tip — ships the tagged merge commit plus (in
    # the steady case) the changelog bot's `[skip ci]` fix-up: no app-code
    # delta. If a trunk merge snuck in between tag cut and this POST, the
    # site can ship newer-than-tagged code — tag and let this run promptly.
    # netlify.toml's ignore command keeps every git-triggered build
    # skipped, so this POST is the only way the site republishes.
    #
    # Dispatches must not repoint production hosting: the tag-shaped `if`
    # guards the job directly. Job-level env rather than a step `if` on
    # `secrets`: GitHub rejects `secrets` inside step `if` outright
    # (actions/runner#520) — the guard below therefore checks the env copy.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [resolve-version, publish]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      NETLIFY_DEPLOY_HOOK_URL: ${{ secrets.NETLIFY_DEPLOY_HOOK_URL }}
    steps:
      - name: Require the deploy hook
        # Fail before anything is posted: an unset secret must be loud now,
        # not a silent "the site never updates" later. Re-running the job
        # after adding the secret deploys in one pass.
        if: env.NETLIFY_DEPLOY_HOOK_URL == ''
        run: |
          echo '::error title=Deploy hook missing::set the secret on the repo (Settings > Secrets and variables > Actions).'
          echo '::error::NETLIFY_DEPLOY_HOOK_URL — Site settings > Build & deploy > Build hooks > Add build hook (name it "v* release", scope Production).'
          echo '::error::NETLIFY_DEPLOY_HOOK_URL is unset.'
          exit 1
      - name: Deploy web (Netlify build hook)
        # A 200 means the Production build is queued, not finished — a
        # broken web build fails in Netlify's build log and publishes
        # nothing, leaving the previous release live; re-run this job to
        # re-POST. No artifact is uploaded: Netlify rebuilds main's tip
        # itself.
        run: |
          echo "Netlify: deploying $VERSION (main @ $GITHUB_SHA)"
          curl -fsS --max-time 60 --retry 3 --retry-delay 2 -X POST -d '{}' "$NETLIFY_DEPLOY_HOOK_URL" > /dev/null
          echo 'Netlify build queued (hook accepted).'

  build-snap:
    needs: resolve-version
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.platforms == 'all' ||
      contains(inputs.platforms, 'snap')
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Fail on snapcraft.yaml version drift
        run: |
          snap_ver=$(grep -Po "^version:\s*'\K[^']+" snap/snapcraft.yaml)
          test "$snap_ver" = "$VERSION" || {
            echo "snap/snapcraft.yaml ($snap_ver) != tag ($VERSION)."
            echo "Bump snap version before tagging."
            exit 1
          }
      - uses: snapcore/action-build@v1
        id: build
      - run: |
          mkdir -p dist
          cp "${{ steps.build.outputs.snap }}" dist/
          ls dist/
      - uses: actions/upload-artifact@v7
        with:
          name: snap-dist
          path: dist/

  publish:
    needs:
      - resolve-version
      - build-android
      - build-linux
      - build-appimage
      - build-windows
      - build-web
      - build-snap
    # One red artifact must not void the rest: run on partial success and
    # publish whatever built. Still skipped when setup itself failed or the
    # run was cancelled.
    if: >-
      always() &&
      !cancelled() &&
      needs.resolve-version.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      # git-cliff needs history to bound the release range and the tags to
      # stamp the section — release-day cost only (~seconds). It runs
      # FIRST on purpose: actions/checkout cleans untracked files by
      # default, so a checkout below the artifact steps could wipe every
      # downloaded dist/ binary. Today that only can't happen because the
      # workspace is fresh on ephemeral runners — an implementation
      # detail, not a contract; ordering makes the safety structural.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      # One download per artifact with continue-on-error: a failed or
      # skipped build leaves no artifact, and that must not fail this job.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: android-dist
          path: dist
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: linux-dist
          path: dist
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: appimage-dist
          path: dist
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: windows-dist
          path: dist
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: web-dist
          path: dist
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: snap-dist
          path: dist
      - run: mkdir -p dist
      - name: Render the release changelog (git-cliff)
        # CHANGELOG.md in the repo is written ONLY by ci.yaml's bot on
        # main pushes; the release itself carries the freshly rendered
        # section as a per-release asset — no trunk writes here, `dist/*`
        # uploads it via the existing Release files glob and SHA256SUMS.
        # Same action as ci.yaml's bot, because the runner has no git-cliff
        # binary preinstalled; OUTPUT points the render at the asset path
        # and --latest bounds it to the tagged release's section.
        # continue-on-error keeps one failed render from voiding the
        # release while still painting the step red (re-run publishes it).
        continue-on-error: true
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --github-token ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: dist/CHANGELOG-v${{ env.VERSION }}.md
      - run: |
          ls -R dist
          # Single top-level copy for the release page (per-artifact copies
          # already travel inside the tarballs, zip, and AppImage).
          cp LICENSE dist/
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: checksums
          path: dist/SHA256SUMS.txt
      # Manual dispatches validate the full pipeline without cutting
      # a public release; only real v* tags publish.
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: Sudoku ${{ env.VERSION }}
          generate_release_notes: true
          files: dist/*
