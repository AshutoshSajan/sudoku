name: guard-dev

# Trunk armor for `dev` (CONVENTIONS.md → Trunk invariants).
# Trunk pushes must be merge-commit heads made by merged PRs:
# direct commits, squash merges (both <2 parents), force-pushes and
# branch deletions are violations. Read from the push event payload
# with jq — no checkout needed, so the job stays seconds-cheap.
# (One-time bootstrap: creating a fresh `dev` from `main` is a 1-parent
# push and will fail this guard; create guard workflows after, not before.)

on:
  push:
    branches: [dev]

permissions: {}

jobs:
  trunk-shape:
    runs-on: ubuntu-24.04
    steps:
      - name: require merge-commit head, no force-push, no deletion
        run: |
          set -euo pipefail
          payload="$GITHUB_EVENT_PATH"

          head_commit="$(jq -r 'if .head_commit then .head_commit.id else "" end' "$payload")"
          deleted="$(jq -r '.deleted // false' "$payload")"
          if [ "$deleted" = "true" ] || [ -z "$head_commit" ]; then
            echo "::error::refs/heads/dev must never be deleted or pushed without a head commit — trunk armor"
            exit 1
          fi

          forced="$(jq -r '.forced // false' "$payload")"
          if [ "$forced" = "true" ]; then
            echo "::error::force-push to refs/heads/dev is forbidden — push task branches and merge via PR instead"
            exit 1
          fi

          parents="$(jq -r '.head_commit.parents | length' "$payload")"
          if [ "$parents" -lt 2 ]; then
            echo "::error::refs/heads/dev head has ${parents} parent(s) — trunk pushes must be merge commits (squash merges count as violations; merge PRs with \"Create a merge commit\")"
            exit 1
          fi

          echo "guard-dev ok: merge-commit head, no force, no deletion"
