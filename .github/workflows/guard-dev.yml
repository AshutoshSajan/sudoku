name: guard-dev

# Trunk armor for `dev` (CONVENTIONS.md → Trunk invariants).
# Trunk pushes must be merge-commit heads made by merged PRs:
# direct commits, squash merges (both <2 parents), force-pushes and
# branch deletions are violations. Read from the push event payload
# with jq — no checkout needed, so the job stays seconds-cheap.
#
# Schema note: webhook `push` payloads do NOT carry `parents` on
# `head_commit` (that is the Commits-API shape). The parent count is
# read from `GET /repos/{owner}/{repo}/commits/{after}`; deletion and
# force facts come straight off the payload. API failures fail closed.
#
# One-time bootstrap caveat: creating a fresh `dev` from `main` is a
# 1-parent push and will fail this guard — create guard workflows after
# the bootstrap, never before.

on:
  push:
    branches: [dev]

permissions: {}

jobs:
  trunk-shape:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: require merge-commit head, no force-push, no deletion
        run: |
          set -euo pipefail
          payload="$GITHUB_EVENT_PATH"

          # Deletion — ref went away or no head commit came with the push.
          deleted="$(jq -r '.deleted // false' "$payload")"
          after="$(jq -r '.after // ""' "$payload")"
          if [ "$deleted" = "true" ] || [ -z "$after" ] \
             || [ "$after" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::refs/heads/dev must never be deleted or pushed without commits — trunk armor"
            exit 1
          fi

          forced="$(jq -r '.forced // false' "$payload")"
          if [ "$forced" = "true" ]; then
            echo "::error::force-push to refs/heads/dev is forbidden — push task branches and merge via PR instead"
            exit 1
          fi

          # Parent count from the Commits REST API (webhooks don't ship it).
          # Fail closed: if the API is unreachable, treat it as a violation.
          parents="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${after}" \
            | jq -e '.parents | length')" || {
            echo "::error::could not read parents of ${after} from the Commits API — failing closed"
            exit 1
          }
          if [ "$parents" -lt 2 ]; then
            echo "::error::refs/heads/dev head has ${parents} parent(s) — trunk pushes must be merge commits (squash merges count as violations; merge PRs with \"Create a merge commit\")"
            exit 1
          fi

          echo "guard-dev ok: merge-commit head (${parents} parents), no force, no deletion"
