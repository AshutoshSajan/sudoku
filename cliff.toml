# git-cliff configuration — Conventional Commits changelog.
# Preview:  git cliff --unreleased
# Regenerate: git cliff -o CHANGELOG.md   (CI does this on every main push)

[changelog]
header = """
# Changelog

All notable changes to Sudoku are documented here, generated automatically
from Conventional Commits by [git-cliff](https://git-cliff.org).\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
    {% if previous.version %}\
        [Full changelog](https://github.com/AshutoshSajan/sudoku/compare/{{ previous.version }}...{{ version }})
    {% endif %}\
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
    - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
        {% if commit.breaking %}**breaking** {% endif %}\
        {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/AshutoshSajan/sudoku/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}\
{% if remote.contributors %}
    ### Contributors
    {% for contributor in remote.contributors %}
    - @{{ contributor.username }}
    {%- endfor %}
{% endif %}\n
"""
footer = "<!-- generated by git-cliff, do not edit manually -->"
trim = true
render_always = false

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
  # Turn "(#123)" suffixes from squash-merges into clickable issue links.
  { pattern = "#([0-9]+)", replace = "[#$1](https://github.com/AshutoshSajan/sudoku/issues/$1)" },
]
commit_parsers = [
  # Keep first: the changelog bot's own commits must never list themselves.
  { message = "^docs: update changelog", skip = true },
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
  { message = "^docs", group = "<!-- 3 -->📚 Documentation" },
  { message = "^refactor", group = "<!-- 4 -->♻️ Refactoring" },
  { message = "^style", group = "<!-- 5 -->🎨 Styling" },
  { message = "^test", group = "<!-- 6 -->🧪 Testing" },
  { message = "^revert", group = "<!-- 7 -->⏪ Reverts" },
]
# Only user-facing types above are listed; chore/ci/build noise is dropped.
protect_breaking_commits = true
filter_commits = true
# Anchored: extension tags (ext-v*) must never become app version sections.
tag_pattern = "^v[0-9]*"
skip_tags = "v0.1.0-beta.1"
ignore_tags = ""
topo_order = true
sort_commits = "newest"

[remote.github]
owner = "AshutoshSajan"
repo = "sudoku"
# Token comes from the GITHUB_TOKEN env var in CI (see ci.yaml changelog job).
# Without it, contributors simply render as an empty section (guarded in template).
