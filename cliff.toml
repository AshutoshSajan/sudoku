# git-cliff configuration — Conventional Commits changelog.
# Preview:  git cliff --unreleased
# Regenerate: git cliff -o CHANGELOG.md   (CI does this on every main push)

[changelog]
header = """
# Changelog

All notable changes to Sudoku are documented here, generated automatically
from Conventional Commits by [git-cliff](https://git-cliff.org).\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
    - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
        {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/AshutoshSajan/sudoku/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}\n
"""
footer = "<!-- generated by git-cliff, do not edit manually -->"
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^docs", group = "<!-- 2 -->Documentation" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Refactoring" },
  { message = "^style", group = "<!-- 5 -->Styling" },
  { message = "^test", group = "<!-- 6 -->Testing" },
  { message = "^chore", group = "<!-- 7 -->Miscellaneous" },
  { message = "^revert", group = "<!-- 8 -->Reverts" },
  { message = "^.*", group = "<!-- 9 -->Other" },
]
filter_commits = false
tag_pattern = "v[0-9]*"
skip_tags = "v0.1.0-beta.1"
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
