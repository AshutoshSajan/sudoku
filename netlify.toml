# Web deploys happen ONLY from `vX.Y.Z` tag pushes, so the site config
# stays simple. netlify.toml's ignore command below skips every
# git-triggered build (autodeploys, preview and branch deploys) — nothing
# publishes from a merge to main or a PR. The tag-gated deploy-web job in
# release.yaml fires the Production build hook (a build hook bypasses this
# ignore gate, which is only evaluated for Git-event builds) once the
# GitHub Release is out; it needs the NETLIFY_DEPLOY_HOOK_URL secret.
# See CONVENTIONS.md §6 for the release contract. A manual `netlify deploy
# --prod` of a local build still works but is out of band.

[build]
  # THE DEPLOY GATE: no Git event deploys — release tags do. A tag is not a
  # branch, so Netlify could not trigger off one itself; release.yaml's
  # deploy-web job POSTs the production build hook instead, which rebuilds
  # main's tip (the commit the tag was cut on — keep tag-cutting on main).
  ignore = "bash -c 'exit 0'"
  command = "bash tool/netlify-build.sh"
  publish = "build/web"

# Flutter web is a single-page app with no deep routes, so no
# redirect rules are needed. Netlify serves .wasm as
# application/wasm out of the box (required by the CanvasKit renderer).
