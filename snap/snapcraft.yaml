# Snap packaging for the Linux desktop build.
# Build on Ubuntu 18.04+ with snapcraft + LXD:
#   sudo snap install snapcraft --classic
#   sudo snap install lxd && sudo lxd init && sudo usermod -a -G lxd $USER
#   snapcraft --use-lxd          # from the project root
# Publish (needs a Snap Store account):
#   snapcraft register sudoku-puzzle-game
#   snapcraft upload sudoku-puzzle-game_1.3.0_amd64.snap --release=edge
# Keep `version` in sync with pubspec.yaml.
name: sudoku-puzzle-game
version: '1.3.0'
# Flutter ships prebuilt engines for x64 and ARM64 only; other arches
# (armhf/ppc64el/s390x/riscv64) can never build, so don't attempt them.
architectures:
  - build-on: amd64
    run-on: amd64
  - build-on: arm64
    run-on: arm64
summary: A beautiful, modern Sudoku puzzle game
description: |
  Sudoku is a beautiful, modern puzzle game: 4 difficulty levels,
  pencil-mark notes, hints, undo, dark mode. Fully offline, no ads,
  no tracking. Free and open source (GPL-3.0).
confinement: strict
base: core22
grade: stable

slots:
  dbus-sudoku:
    interface: dbus
    bus: session
    name: com.ashutoshsajan.sudoku

apps:
  sudoku:
    command: sudoku
    extensions: [gnome]
    plugs:
      - network
    slots:
      - dbus-sudoku

parts:
  sudoku:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart
